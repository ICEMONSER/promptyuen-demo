<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ประเมิน AI พร้อมยื่น</title><style>body{font:17px/1.6 system-ui;max-width:900px;margin:auto;padding:20px;color:#172c43}button{font:inherit;padding:10px;margin:5px}article{padding:12px;border:1px solid #ccd8e5;margin:12px 0;border-radius:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere}progress{width:100%}</style><body><h1>ประเมิน AI ด้วยเคสสมมติ 12 เคส</h1><p>ใช้โมเดลจริงในเครื่อง ไม่มีค่า API ครั้งแรกดาวน์โหลดหลาย GB ต้องใช้ WebGPU ไม่ส่งข้อมูลส่วนบุคคล</p><p>คะแนนนี้วัดการพบข้อความอ้างอิงและหมวดหมู่ตามชุดทดสอบขนาดเล็ก ไม่ใช่คะแนนการแข่งขันหรือการรับรองความถูกต้องทางกฎหมาย</p><button id="run">เริ่มทดสอบโมเดลจริง</button><button id="stop" disabled>หยุด</button><button id="save" disabled>ดาวน์โหลดผลทดสอบ</button><p role="status" id="status">ยังไม่ได้ทดสอบโมเดลจริง</p><div id="results"></div><script type="module" src="./run.js"></script></body></html>
